name: Build ClassicLockScreen

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 30

    steps:
      - name: Descargar código
        uses: actions/checkout@v5

      - name: Seleccionar Xcode 15.4
        shell: bash
        run: |
          set -euo pipefail

          test -d /Applications/Xcode_15.4.app
          sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer

          xcodebuild -version

      - name: Instalar herramientas
        shell: bash
        run: |
          set -euo pipefail

          brew install ldid xz dpkg

      - name: Instalar Theos
        shell: bash
        run: |
          set -euo pipefail

          rm -rf "$GITHUB_WORKSPACE/theos"

          git clone --recursive \
            https://github.com/theos/theos.git \
            "$GITHUB_WORKSPACE/theos"

          test -f "$GITHUB_WORKSPACE/theos/makefiles/common.mk"

      - name: Instalar y corregir SDK de iOS 10.3
        shell: bash
        run: |
          set -euo pipefail

          rm -rf "$GITHUB_WORKSPACE/theos/sdks"

          git clone --depth 1 \
            https://github.com/theos/sdks.git \
            "$GITHUB_WORKSPACE/theos/sdks"

          SDK="$GITHUB_WORKSPACE/theos/sdks/iPhoneOS10.3.sdk"

          test -d "$SDK"
          test -f "$SDK/usr/lib/libobjc.A.tbd"

          while IFS= read -r -d '' file; do
            sed -i '' \
              -e 's/, i386, x86_64//g' \
              -e 's/i386, x86_64, //g' \
              -e 's/, i386//g' \
              -e 's/, x86_64//g' \
              "$file"
          done < <(
            find "$SDK" -type f -name '*.tbd' -print0
          )

          echo "Contenido corregido de libobjc:"
          head -n 6 "$SDK/usr/lib/libobjc.A.tbd"

          grep -q 'arm64' "$SDK/usr/lib/libobjc.A.tbd"

          if grep -qE 'i386|x86_64' "$SDK/usr/lib/libobjc.A.tbd"; then
            echo "libobjc todavía contiene arquitecturas de simulador."
            exit 1
          fi

      - name: Adaptar proyecto antiguo
        shell: bash
        run: |
          set -euo pipefail

          MAIN_MAKEFILE="Makefile"
          SETTINGS_MAKEFILE="classiclockscreensettings/Makefile"
          SETTINGS_SOURCE="classiclockscreensettings/ClassicLockScreenSettings.mm"

          test -f "$MAIN_MAKEFILE"
          test -f "$SETTINGS_MAKEFILE"
          test -f "$SETTINGS_SOURCE"
          test -f "control"

          sed -i '' \
            's|include theos/makefiles/common.mk|include $(THEOS)/makefiles/common.mk|g' \
            "$MAIN_MAKEFILE"

          sed -i '' \
            's|include theos/makefiles/common.mk|include $(THEOS)/makefiles/common.mk|g' \
            "$SETTINGS_MAKEFILE"

          sed -i '' \
            '/^SUBPROJECTS += extrainst_$/d' \
            "$MAIN_MAKEFILE"

          sed -i '' \
            '/^SUBPROJECTS += prerm$/d' \
            "$MAIN_MAKEFILE"

          sed -i '' \
            '/^SUBPROJECTS += classiclockscreenextractlegacy$/d' \
            "$MAIN_MAKEFILE"

          sed -i '' \
            's/^ARCHS = armv7 arm64$/ARCHS = arm64/' \
            "$SETTINGS_MAKEFILE"

          sed -i '' \
            's/^Version:.*/Version: 4.0-oss/' \
            control

          if ! grep -q '^GO_EASY_ON_ME' "$MAIN_MAKEFILE"; then
            {
              printf 'GO_EASY_ON_ME = 1\n'
              cat "$MAIN_MAKEFILE"
            } > "$MAIN_MAKEFILE.tmp"

            mv "$MAIN_MAKEFILE.tmp" "$MAIN_MAKEFILE"
          fi

          if ! grep -q '^GO_EASY_ON_ME' "$SETTINGS_MAKEFILE"; then
            {
              printf 'GO_EASY_ON_ME = 1\n'
              cat "$SETTINGS_MAKEFILE"
            } > "$SETTINGS_MAKEFILE.tmp"

            mv "$SETTINGS_MAKEFILE.tmp" "$SETTINGS_MAKEFILE"
          fi

          if ! grep -q \
            'ClassicLockScreenSettings_CFLAGS.*Wno-deprecated-declarations' \
            "$SETTINGS_MAKEFILE"
          then
            printf '\nClassicLockScreenSettings_CFLAGS += -Wno-deprecated-declarations -Wno-error=deprecated-declarations\n' \
              >> "$SETTINGS_MAKEFILE"
          fi

          if ! grep -q \
            '^#pragma clang diagnostic ignored "-Wdeprecated-declarations"' \
            "$SETTINGS_SOURCE"
          then
            {
              printf '#pragma clang diagnostic ignored "-Wdeprecated-declarations"\n'
              cat "$SETTINGS_SOURCE"
            } > "$SETTINGS_SOURCE.tmp"

            mv "$SETTINGS_SOURCE.tmp" "$SETTINGS_SOURCE"
          fi

      - name: Comprobar correcciones existentes
        shell: bash
        run: |
          set -euo pipefail

          grep -q '#include <dlfcn.h>' DRM.pch
          grep -q '#import <math.h>' CSLockScreenCameraViewController.mm
          grep -q 'height = fabs(height);' CSLockScreenCameraViewController.mm

          SUCCESS_COUNT="$(
            grep -c 'BOOL success = %orig;' iOS10.xm || true
          )"

          if [ "$SUCCESS_COUNT" -lt 2 ]; then
            echo "Los dos métodos de desbloqueo de iOS10.xm no están corregidos."
            exit 1
          fi

          echo "Las correcciones del código fuente están presentes."

      - name: Mostrar configuración
        shell: bash
        run: |
          set -euo pipefail

          echo "Xcode seleccionado:"
          xcodebuild -version

          echo
          echo "Makefile principal:"
          grep -n \
            'ARCHS\|GO_EASY\|SUBPROJECTS\|common.mk' \
            Makefile

          echo
          echo "Makefile de Ajustes:"
          grep -n \
            'ARCHS\|GO_EASY\|CFLAGS\|common.mk' \
            classiclockscreensettings/Makefile

          echo
          echo "Versión:"
          grep -n '^Version:' control

      - name: Compilar paquete rootful
        shell: bash
        run: |
          set -euo pipefail

          export THEOS="$GITHUB_WORKSPACE/theos"
          export GO_EASY_ON_ME=1

          make clean package \
            FINALPACKAGE=1 \
            GO_EASY_ON_ME=1 \
            THEOS="$THEOS" \
            TARGET="iphone:clang:10.3:10.0" \
            ARCHS="arm64" \
            THEOS_PACKAGE_SCHEME="" \
            THEOS_PLATFORM_DEB_COMPRESSION_TYPE="gzip" \
            messages=yes

      - name: Comprobar archivo DEB
        shell: bash
        run: |
          set -euo pipefail

          DEB="$(
            find packages \
              -maxdepth 1 \
              -type f \
              -name '*.deb' \
              -print \
              -quit
          )"

          if [ -z "$DEB" ]; then
            echo "No se generó ningún archivo DEB."
            exit 1
          fi

          echo "Paquete generado:"
          ls -lh "$DEB"

          echo
          echo "Información del paquete:"
          dpkg-deb --info "$DEB"

          echo
          echo "SHA-256:"
          shasum -a 256 "$DEB"

      - name: Guardar archivo DEB
        uses: actions/upload-artifact@v6
        with:
          name: ClassicLockScreen-deb
          path: packages/*.deb
          if-no-files-found: error
          retention-days: 7
