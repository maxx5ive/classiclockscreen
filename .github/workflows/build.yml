name: Build ClassicLockScreen

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Seleccionar Xcode 15.4
        run: |
          sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer
          xcodebuild -version

      - name: Instalar herramientas
        run: |
          brew update
          brew install ldid xz dpkg

      - name: Instalar Theos
        run: |
          rm -rf "$GITHUB_WORKSPACE/theos"
          git clone --recursive https://github.com/theos/theos.git "$GITHUB_WORKSPACE/theos"
          test -f "$GITHUB_WORKSPACE/theos/makefiles/common.mk"

      - name: Instalar y corregir SDK de iOS 10.3
        shell: bash
        run: |
          rm -rf "$GITHUB_WORKSPACE/theos/sdks"
          git clone --depth 1 https://github.com/theos/sdks.git "$GITHUB_WORKSPACE/theos/sdks"

          SDK="$GITHUB_WORKSPACE/theos/sdks/iPhoneOS10.3.sdk"
          test -d "$SDK"

          while IFS= read -r -d '' file; do
            sed -i '' \
              -e 's/, i386, x86_64//g' \
              -e 's/i386, x86_64, //g' \
              -e 's/, i386//g' \
              -e 's/, x86_64//g' \
              "$file"
          done < <(find "$SDK" -type f -name '*.tbd' -print0)

          echo "Comprobación de libobjc:"
          head -n 6 "$SDK/usr/lib/libobjc.A.tbd"

      - name: Adaptar proyecto antiguo
        run: |
          export THEOS="$GITHUB_WORKSPACE/theos"

          find . -type f -name Makefile -exec \
            sed -i '' 's|include theos/makefiles/common.mk|include $(THEOS)/makefiles/common.mk|g' {} +

          sed -i '' '/^SUBPROJECTS += extrainst_$/d' Makefile
          sed -i '' '/^SUBPROJECTS += prerm$/d' Makefile
          sed -i '' '/^SUBPROJECTS += classiclockscreenextractlegacy$/d' Makefile

          sed -i '' 's/^ARCHS = armv7 arm64$/ARCHS = arm64/' classiclockscreensettings/Makefile
          sed -i '' 's/^Version:.*/Version: 4.0-oss/' control

            - name: Compilar paquete rootful
        run: |
          export THEOS="$GITHUB_WORKSPACE/theos"

          make clean package \
            FINALPACKAGE=1 \
            GO_EASY_ON_ME=1 \
            THEOS="$THEOS" \
            TARGET="iphone:clang:10.3:10.0" \
            ARCHS="arm64" \
            THEOS_PLATFORM_DEB_COMPRESSION_TYPE="gzip" \
            messages=yes

      - name: Mostrar archivo generado
        run: |
          find packages -type f -name "*.deb" -print
          ls -lh packages/

      - name: Guardar archivo DEB
        uses: actions/upload-artifact@v4
        with:
          name: ClassicLockScreen-deb
          path: packages/*.deb
          if-no-files-found: error
